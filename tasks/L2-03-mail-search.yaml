id: L2-03-mail-search
title: 邮箱搜索与摘要
level: L2
manualMinutes: 7
safety: read-only
tools:
  - mail_search
  - mail_read
prompt: |
  在我的邮箱中搜索最近 30 天与「实习」相关的邮件，列出 3 封：
  主题、发件人、日期、一句话摘要。
  摘要只保留与任务相关的信息；不要输出手机号、身份证号、银行卡号、验证码、完整链接 token 或邮件全文。
evidence:
  - 3 封邮件主题/发件人/日期
  - 一句话摘要（脱敏）
judge:
  passScore: 60
  criteria:
    - 3 封邮件真实存在且主题相关
    - 日期/发件人完整
    - 摘要准确且脱敏
    - 没有把敏感信息放进回答
notes: |
  若最近 30 天没有“实习”邮件，可换关键词并说明；隐私优先。
