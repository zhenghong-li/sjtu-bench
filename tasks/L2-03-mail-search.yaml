id: L2-03-mail-search
title: 邮箱课程/作业邮件搜索
level: L2
manualMinutes: 7
referenceSeconds: 40
timeLimitSeconds: 60
safety: read-only
prompt: |
  在我的邮箱中搜索最近 30 天与「作业」相关的邮件，列出 3 封：
  主题、发件人、日期、一句话摘要。
  如果没有「作业」相关邮件，改用「课程」或「截止」关键词，并在回答中说明实际使用的关键词。
  摘要只保留与任务相关的信息；不要输出手机号、身份证号、银行卡号、验证码、完整链接 token 或邮件全文。
evidence:
  - 3 封邮件主题/发件人/日期
  - 实际使用的关键词
  - 一句话摘要（脱敏）
judge:
  passScore: 60
  criteria:
    - 3 封邮件真实存在且与课程/作业相关
    - 实际关键词与回答一致
    - 日期/发件人完整
    - 摘要准确且脱敏
    - 没有把敏感信息放进回答
