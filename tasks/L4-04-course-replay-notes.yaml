id: L4-04-course-replay-notes
title: 课程回放 → ASR → 学习笔记
level: L4
manualMinutes: 25
referenceSeconds: 240
timeLimitSeconds: 360
safety: read-only
prompt: |
  选一门你正在上的、**有课程回放**的课。目标：在**不绕过任何权限/DRM、不传播**的前提下，
  完成一次“回放 → 本地 ASR → 笔记”的最小工作流：
  1) 找到课程回放入口，确认课程/平台是否允许下载或离线缓存；
  2) 若允许：下载/导出**你自己有权访问**的一小段（≤5 分钟）音视频到本地；
     若不允许：不要下载，记录入口、限制和你认为合规的替代方案；
  3) 在本地做 ASR（系统自带/开源模型/API 均可），生成带时间戳的笔记：
     主题、关键概念、公式/术语、3 条待办；
  4) 给出完整工作流与大致耗时，并说明版权/隐私边界（仅自己学习，不上传、不传播）。
  如果没有可用回放，可选一段公开课音频做替代演示，但必须注明替代来源。
evidence:
  - 回放入口/替代来源，以及“是否允许下载”的判断
  - ASR 笔记或流程设计（含时间戳/结构化要点）
  - 工作流步骤、耗时、版权/隐私边界
judge:
  passScore: 60
  criteria:
    - 找到真实回放入口，或明确说明没有并给出替代来源
    - 没有绕过权限/DRM，没有上传或传播课程内容
    - 有 ASR → 结构化笔记产物，或完整的合规流程设计
    - 笔记包含主题/关键概念/术语/待办等可核查信息
    - 说明了工作流、耗时与版权/隐私边界
credit: |
  需求来源：水源用户 @Spirit的magixx本人 在 SJTU-Bench 帖第 28 楼的反馈：
  https://shuiyuan.sjtu.edu.cn/t/topic/526426/28
  原反馈重点：下载作业、下载视频回放 → ASR → 生成 notes、直播流 ASR + 翻译等。
notes: |
  该任务为新增任务，referenceSeconds 为初始估计；若平台禁止下载，允许只提交合规流程设计，
  但不得绕过权限、不得传播课程内容。
