id: L4-03-agent-setup
title: 个人校园 Agent 配置建议（含社区案例对照）
level: L4
manualMinutes: 15
referenceSeconds: 75
timeLimitSeconds: 113
safety: read-only
prompt: |
  根据本次 SJTU-Bench 中我的表现（哪些任务快/哪些任务失败/哪些需要人工确认），
  以及我的高频校园场景，给我一份“我的校园 Agent 配置建议”：
  1) 建议安装/启用的 3–5 个能力/工具；
  2) 3 个最适合自动化的工作流（说明触发方式与人工确认点）；
  3) 2 个不建议自动化的场景及原因；
  4) 隐私/安全设置建议；
  5) 找 1 篇公开的校园/个人信息基建分享（例如水源「分享个人信息基建和 Agent 设定」：
     https://shuiyuan.sjtu.edu.cn/t/topic/476017 ，或你找到的其他公开分享），
     提炼 2 个可复用模式（如只读 API/IMAP、CLI 网关、消息桥/定时简报），
     判断哪些适合我、哪些不适合，说明维护成本与隐私边界。
  要求具体、可执行，不要泛泛而谈；不要照搬案例里的配置。
evidence:
  - 5 个部分齐全
  - 结合了本次 bench 结果
  - 引用了 1 个公开案例并给出链接
judge:
  passScore: 60
  criteria:
    - 明确引用本次 bench 的表现（不是通用模板）
    - 能力/工作流与校园场景匹配，并区分自动化与人工确认
    - 引用并批判性评估至少 1 个公开案例（不是照抄）
    - 说明维护成本与隐私/安全边界
