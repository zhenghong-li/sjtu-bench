id: L4-03-agent-setup
title: 个人校园 Agent 配置建议
level: L4
manualMinutes: 12
safety: read-only
tools: []
prompt: |
  根据本次 SJTU-Bench 中我的表现（哪些任务快/哪些任务失败/哪些需要人工确认），
  以及我的高频校园场景，给我一份“我的校园 Agent 配置建议”：
  1) 建议安装/启用的 3–5 个工具；
  2) 3 个最适合自动化的工作流（说明触发方式与人工确认点）；
  3) 2 个不建议自动化的场景及原因；
  4) 隐私/安全设置建议。
  要求具体、可执行，不要泛泛而谈。
evidence:
  - 4 个部分齐全
  - 结合了本次 bench 结果
judge:
  passScore: 60
  criteria:
    - 明确引用本次 bench 的表现（不是通用模板）
    - 工具/工作流与校园场景匹配
    - 区分自动化与人工确认
    - 有隐私/安全建议
notes: |
  可在本地生成，不上传；这是“个人 Agent 定制”的入口。
