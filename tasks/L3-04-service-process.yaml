id: L3-04-service-process
title: 交我办办事流程规划
level: L3
manualMinutes: 8
safety: read-only
tools:
  - services_search
  - services_open
prompt: |
  在交我办中找一项你近期可能用到的办事事项（例如成绩单、在读证明、户籍、报销），
  打开事项页，输出：事项名称、办理入口、所需材料/步骤（按页面实际信息）、预计办理时间/地点（若有）。
  最后给出你的办理计划（先做什么、需要准备什么）。
  不要提交任何申请。
evidence:
  - 事项名称/入口/链接
  - 材料与步骤
  - 个人办理计划
judge:
  passScore: 60
  criteria:
    - 事项真实存在且链接可追溯
    - 材料/步骤来自页面而非编造
    - 办理计划具体、可执行
    - 没有提交申请
notes: |
  如果页面信息不足，明确说明“页面未展示”，不要猜。
