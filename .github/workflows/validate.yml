name: Validate tasks

on:
  push:
    paths:
      - 'tasks/**'
      - 'scripts/**'
      - 'package.json'
  pull_request:
    paths:
      - 'tasks/**'
      - 'scripts/**'
      - 'package.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: npm run validate
